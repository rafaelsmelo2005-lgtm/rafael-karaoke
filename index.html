<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafael-Karaoke | Cantar Online Grátis</title>
    <meta name="description" content="Cante karaokê online grátis com Rafael: letra na tela, pontuação e ranking da festa.">
    <meta name="author" content="Rafael-Karaoke">
    
    <!-- Estilos (Tailwind CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lógica (React) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1b1030 0%, #4c1d6b 50%, #7a1f4f 100%);
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .lyrics-text {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .lyrics-active {
            color: #22d3ee;
            transform: scale(1.05);
            font-weight: bold;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState('home'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [queue, setQueue] = useState([]);
            const [currentSong, setCurrentSong] = useState(null);
            const [lyricsIndex, setLyricsIndex] = useState(0);
            
            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) return;
                
                const newSong = {
                    id: Date.now(),
                    title: searchQuery,
                    artist: "Artista Desconhecido",
                    duration: "3:30",
                    lyrics: [
                        "Esta é uma letra de exemplo para o Rafael-Karaoke",
                        "No mundo real, isso viria da API do YouTube",
                        "Mas você pode editar aqui no código para adicionar suas músicas",
                        "Prepare-se para cantar!",
                        "A festa começou no Rafael-Karaoke!"
                    ]
                };
                
                setQueue([...queue, newSong]);
                setSearchQuery('');
                if (queue.length === 0) {
                    setCurrentSong(newSong);
                }
            };

            const playNext = () => {
                if (queue.length > 0) {
                    const next = queue[0];
                    setQueue(queue.slice(1));
                    setCurrentSong(next);
                    setLyricsIndex(0);
                    startLyricsTimer();
                } else {
                    setCurrentSong(null);
                }
            };

            const startLyricsTimer = () => {
                if (currentSong && currentSong.lyrics) {
                    let idx = 0;
                    const interval = setInterval(() => {
                        idx++;
                        if (idx >= currentSong.lyrics.length) {
                            clearInterval(interval);
                            setTimeout(playNext, 2000);
                        } else {
                            setLyricsIndex(idx);
                        }
                    }, 4000); 
                }
            };

            useEffect(() => {
                if (currentSong) startLyricsTimer();
                return () => clearInterval(interval);
            }, [currentSong]);

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="p-4 glass-panel sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600 cursor-pointer" onClick={() => setView('home')}>
                                🎤 Rafael-Karaoke
                            </h1>
                            <nav className="space-x-4">
                                <button onClick={() => setView('home')} className="hover:text-purple-300">Início</button>
                                <button onClick={() => setView('queue')} className="hover:text-purple-300">Fila ({queue.length})</button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-grow flex flex-col items-center justify-center p-4">
                        
                        {view === 'home' && (
                            <div className="text-center max-w-2xl w-full">
                                <h2 className="text-5xl font-bold mb-6">Pronto para cantar?</h2>
                                <p className="text-xl text-gray-300 mb-8">O karaokê online mais divertido do Brasil.</p>
                                
                                <form onSubmit={handleSearch} className="flex flex-col sm:flex-row gap-4 mb-10">
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Busque por música ou artista..."
                                        className="flex-grow p-4 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                    <button type="submit" className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-8 rounded-xl transition">
                                        Buscar e Adicionar
                                    </button>
                                </form>

                                {queue.length === 0 && (
                                    <div className="text-gray-400">
                                        <p>Nenhuma música na fila. Busque acima para começar!</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'player' && currentSong && (
                            <div className="w-full max-w-4xl text-center">
                                <div className="mb-8">
                                    <h2 className="text-3xl font-bold mb-2">{currentSong.title}</h2>
                                    <p className="text-xl text-purple-300">{currentSong.artist}</p>
                                </div>
                                
                                <div className="glass-panel p-10 rounded-2xl min-h-[300px] flex items-center justify-center">
                                    <div className="space-y-6">
                                        {currentSong.lyrics.map((line, idx) => (
                                            <p key={idx} className={`text-3xl md:text-5xl lyrics-text ${idx === lyricsIndex ? 'lyrics-active' : 'text-gray-500'}`}>
                                                {line}
                                            </p>
                                        ))}
                                    </div>
                                </div>

                                <div className="mt-8 flex justify-center gap-4">
                                    <button 
                                        onClick={playNext}
                                        className="bg-purple-600 hover:bg-purple-700 p-4 rounded-full font-bold"
                                    >
                                        ⏭ Próxima
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'queue' && (
                            <div className="w-full max-w-2xl">
                                <h2 className="text-3xl font-bold mb-6 text-center">Fila de Músicas</h2>
                                {queue.length === 0 ? (
                                    <p className="text-center text-gray-400">Fila vazia.</p>
                                ) : (
                                    <ul className="space-y-3">
                                        {queue.map((song, idx) => (
                                            <li key={song.id} className="glass-panel p-4 rounded-xl flex justify-between items-center">
                                                <span><strong>{idx + 1}.</strong> {song.title} - {song.artist}</span>
                                                <span className="text-sm text-gray-400">{song.duration}</span>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                                <div className="mt-8 text-center">
                                    <button onClick={() => setView('home')} className="text-purple-300 hover:underline">
                                        ← Voltar para busca
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-4 text-center text-gray-500 text-sm">
                        © 2026 Rafael-Karaoke. Todos os direitos reservados.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
